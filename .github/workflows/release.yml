name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.label }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: md-reader-linux-x86_64.tar.gz
            binary: md-reader
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: md-reader-windows-x86_64.zip
            binary: md-reader.exe
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: md-reader-macos-aarch64.tar.gz
            binary: md-reader

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [ "$tag" != "$version" ]; then
            echo "error: tag v${tag} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}
